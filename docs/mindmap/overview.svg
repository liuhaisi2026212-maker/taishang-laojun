<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1662" viewBox="0 0 1200 1662" role="img" aria-labelledby="title desc">
<title id="title">太上老君AI炼丹炉：创作方法全景图</title>
<desc id="desc">AI 先下判断、用户校准；七条底层判断贯穿选材、看火、丹方、开炉、回炉、收丹、成丹七个模块。</desc>
<rect width="1200" height="1662" rx="24" fill="#101725"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<text x="44" y="66" font-size="42" fill="#ffd36a" font-weight="700">太上老君 · AI炼丹炉</text>
<text x="44" y="106" font-size="23" fill="#d4dce9" font-weight="400">把别人的爆款，炼成你自己的视频　·　版本 0.7.2</text>
<rect x="40" y="136" width="1120" height="96" rx="16" fill="#192439" stroke="#ffd36a"/>
<text x="64" y="174" font-size="27" fill="#ffd36a" font-weight="700">总控台：按你此刻在哪，调对的兵器</text>
<text x="64" y="210" font-size="21" fill="#d4dce9" font-weight="400">有灵感就用自己的事直接拍；没灵感就刷对标、拆爆款、存弹药库。需要认识你时才访谈。AI 下判断，你来校准。</text>
<text x="44" y="268" font-size="25" fill="#eef3fc" font-weight="600">炉心：七条底层判断（每个模块都从这里推）</text>
<rect x="40" y="290" width="550" height="62" rx="16" fill="#192439" stroke="#3a4a66"/>
<text x="58" y="317" font-size="21" fill="#ffd36a" font-weight="650">1. 破冰先于一切</text>
<text x="58" y="341" font-size="16" fill="#b8c3d6" font-weight="400">陌生人只给你一两秒，先让他感兴趣，信任靠后面的证据挣</text>
<rect x="610" y="290" width="550" height="62" rx="16" fill="#192439" stroke="#3a4a66"/>
<text x="628" y="317" font-size="21" fill="#ffd36a" font-weight="650">2. 观众在想什么</text>
<text x="628" y="341" font-size="16" fill="#b8c3d6" font-weight="400">想躺平的贪和懒、没意识到的痛点、对你的防御</text>
<rect x="40" y="364" width="550" height="62" rx="16" fill="#192439" stroke="#3a4a66"/>
<text x="58" y="391" font-size="21" fill="#ffd36a" font-weight="650">3. 用事件衬托内核</text>
<text x="58" y="415" font-size="16" fill="#b8c3d6" font-weight="400">直白说没人信，让观众从一件事里自己看出来</text>
<rect x="610" y="364" width="550" height="62" rx="16" fill="#192439" stroke="#3a4a66"/>
<text x="628" y="391" font-size="21" fill="#ffd36a" font-weight="650">4. 判断力胜过教程</text>
<text x="628" y="415" font-size="16" fill="#b8c3d6" font-weight="400">热点是载体，判断是内容；只露果，不穷尽</text>
<rect x="40" y="438" width="550" height="62" rx="16" fill="#192439" stroke="#3a4a66"/>
<text x="58" y="465" font-size="21" fill="#ffd36a" font-weight="650">5. 钩子马上兑现</text>
<text x="58" y="489" font-size="16" fill="#b8c3d6" font-weight="400">下一秒就用画面或事件接住，接住它的又是下一个钩子</text>
<rect x="610" y="438" width="550" height="62" rx="16" fill="#192439" stroke="#3a4a66"/>
<text x="628" y="465" font-size="21" fill="#ffd36a" font-weight="650">6. 展示什么，吸引什么人</text>
<text x="628" y="489" font-size="16" fill="#b8c3d6" font-weight="400">成品招要成品的，过程招学习者，忙碌招求职者</text>
<rect x="40" y="512" width="550" height="62" rx="16" fill="#192439" stroke="#3a4a66"/>
<text x="58" y="539" font-size="21" fill="#ffd36a" font-weight="650">7. 适合自己的才是兵器</text>
<text x="58" y="563" font-size="16" fill="#b8c3d6" font-weight="400">对标、工具、表达都放进自己的条件里掂量</text>
<rect x="40" y="612" width="550" height="206" rx="16" fill="#192439" stroke="#ff898d"/>
<text x="62" y="650" font-size="26" fill="#ff898d" font-weight="650">01 选材 · 找对标拆爆款</text>
<text x="62" y="688" font-size="18" fill="#d4dce9" font-weight="400">找条件一致、想吸引的人也一致的对标</text>
<text x="62" y="719" font-size="18" fill="#d4dce9" font-weight="400">拆开看它为什么爆：撑着它的是哪一两个机制</text>
<text x="62" y="750" font-size="18" fill="#d4dce9" font-weight="400">复读、客户、替换三关掂量，用你自己的事接住</text>
<text x="62" y="792" font-size="18" fill="#ff898d" font-weight="400">交付：保留什么、换掉什么、用你的哪件事接住</text>
<rect x="610" y="612" width="550" height="206" rx="16" fill="#192439" stroke="#ffbd72"/>
<text x="632" y="650" font-size="26" fill="#ffbd72" font-weight="650">02 看火 · 选题决策链</text>
<text x="632" y="688" font-size="18" fill="#d4dce9" font-weight="400">起点 → 观众最关心什么 → 你拿什么接住</text>
<text x="632" y="719" font-size="18" fill="#d4dce9" font-weight="400">靠哪种吸引力：娱乐 / 帮助 / 实力 / 下危机</text>
<text x="632" y="750" font-size="18" fill="#d4dce9" font-weight="400">会招来谁？开头的承诺拿什么兑现？</text>
<text x="632" y="792" font-size="18" fill="#ffbd72" font-weight="400">交付：1–3 个私人定制方向，推荐一个</text>
<rect x="40" y="836" width="550" height="206" rx="16" fill="#192439" stroke="#f4a6d7"/>
<text x="62" y="874" font-size="26" fill="#f4a6d7" font-weight="650">03 丹方 · 系列策划</text>
<text x="62" y="912" font-size="18" fill="#d4dce9" font-weight="400">判断型、现场型、事件型、串联型、上手型，选一个当主线</text>
<text x="62" y="943" font-size="18" fill="#d4dce9" font-weight="400">服务观众不服务自己；列不出五期就撑不住</text>
<text x="62" y="974" font-size="18" fill="#d4dce9" font-weight="400">一个人拍得动吗？一期期拍下去，来的是谁？</text>
<text x="62" y="1016" font-size="18" fill="#f4a6d7" font-weight="400">交付：固定什么、换什么、首批五期、第一期怎么拍</text>
<rect x="610" y="836" width="550" height="206" rx="16" fill="#192439" stroke="#78dcad"/>
<text x="632" y="874" font-size="26" fill="#78dcad" font-weight="650">04 开炉 · 开头与结构</text>
<text x="632" y="912" font-size="18" fill="#d4dce9" font-weight="400">一句话里装几个好懂的信息，完成破冰</text>
<text x="632" y="943" font-size="18" fill="#d4dce9" font-weight="400">勾证衔接，最好接成钩子链</text>
<text x="632" y="974" font-size="18" fill="#d4dce9" font-weight="400">收尾给看完的理由和关注的理由，然后干脆结束</text>
<text x="632" y="1016" font-size="18" fill="#78dcad" font-weight="400">交付：第一句、证据画面、推进、收尾和理由</text>
<rect x="40" y="1060" width="550" height="206" rx="16" fill="#192439" stroke="#c8a4ff"/>
<text x="62" y="1098" font-size="26" fill="#c8a4ff" font-weight="650">05 回炉 · 完整成稿</text>
<text x="62" y="1136" font-size="18" fill="#d4dce9" font-weight="400">逐字稿是弹药库，先存不急着改</text>
<text x="62" y="1167" font-size="18" fill="#d4dce9" font-weight="400">先有场景和目的，再翻弹药库找观点</text>
<text x="62" y="1198" font-size="18" fill="#d4dce9" font-weight="400">借观点不借脉络；AI 初稿按改稿六刀做减法</text>
<text x="62" y="1240" font-size="18" fill="#c8a4ff" font-weight="400">交付：可以直接念的完整稿</text>
<rect x="610" y="1060" width="550" height="206" rx="16" fill="#192439" stroke="#8ec9ff"/>
<text x="632" y="1098" font-size="26" fill="#8ec9ff" font-weight="650">06 收丹 · 标题</text>
<text x="632" y="1136" font-size="18" fill="#d4dce9" font-weight="400">标题不等于选题，剪完再想</text>
<text x="632" y="1167" font-size="18" fill="#d4dce9" font-weight="400">补信息 / 给期待 / 替开头当“总”</text>
<text x="632" y="1198" font-size="18" fill="#d4dce9" font-weight="400">跟我有关：认人、认事、认心，用陌生人的眼睛检查</text>
<text x="632" y="1240" font-size="18" fill="#8ec9ff" font-weight="400">交付：需要几个给几个，每个说清“有关”在哪</text>
<rect x="40" y="1284" width="550" height="206" rx="16" fill="#192439" stroke="#ffd36a"/>
<text x="62" y="1322" font-size="26" fill="#ffd36a" font-weight="650">07 成丹 · 变现承接</text>
<text x="62" y="1360" font-size="18" fill="#d4dce9" font-weight="400">点赞、咨询、成交分开看</text>
<text x="62" y="1391" font-size="18" fill="#d4dce9" font-weight="400">预期用户 ≠ 实际用户：纠偏、顺势，或拒绝</text>
<text x="62" y="1422" font-size="18" fill="#d4dce9" font-weight="400">一个能兑现的交付，只走平台允许的承接</text>
<text x="62" y="1464" font-size="18" fill="#ffd36a" font-weight="400">交付：一个交付、承接路径、交付成本与观察点</text>
<text x="44" y="1516" font-size="19" fill="#9facbf" font-weight="400">底味访谈：需要认识你时才用：让你越聊越想说，AI 替你总结成使用者档案</text>
<text x="44" y="1550" font-size="19" fill="#9facbf" font-weight="400">反馈复盘：沿链条找第一个偏掉的环节，再选纠偏或顺势</text>
<text x="44" y="1584" font-size="19" fill="#ffbd72" font-weight="400">底线：不编经历和数字 · 钩子要兑现 · 合规承接 · 不服务害人的需求</text>
<text x="44" y="1628" font-size="16" fill="#6f7d93" font-weight="400">方法来自柳爷做内容的经验，不是流量保证。 点击图片进入可展开的交互版。</text>
</g>
</svg>
